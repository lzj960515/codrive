schemaVersion: 1
map:
  id: codrive
  title: Codrive
  summary: Codrive uses one global opt-in, read at ordinary task-turn dispatch and again when a completed Integration is consumed, to govern task-time business understanding and reviewed, repository-scoped Semantic Atlas maintenance.

nodes:
  - id: codrive
    kind: domain
    name: Codrive
    summary: Coordinates local product tasks and opt-in, reviewed business-map maintenance after their completed integrations.
    aliases: []
    anchors:
      - kind: document
        value: AGENTS.md
        description: Current product and task-lifecycle contract.

  - id: codrive.semantic-atlas-automatic-maintenance
    kind: capability
    name: Semantic Atlas automatic maintenance
    summary: One global opt-in governs two lifecycle checks so ordinary task turns receive Semantic Atlas guidance when it is enabled at dispatch, while completed Integrations enter repository reconciliation only when they belong to its current enabled period.
    notes: Semantic Atlas owns candidate and business-domain interpretation; Codrive owns the opt-in, completed-task trigger, and ordinary task lifecycle.
    aliases:
      - Automatic business-map maintenance
    anchors:
      - kind: document
        value: docs/architecture/semantic-atlas-maintenance.md
        description: Product boundary, lifecycle, and recovery contract for automatic maintenance.

  - id: codrive.semantic-atlas-automatic-maintenance.reconcile-after-integration
    kind: scenario
    name: Reconcile business map after integration
    summary: Only a completed repository-backed Integration, including a maintenance Integration, within the global opt-in's current enabled period proceeds to the open-maintenance check and, when none is open, the actionable-candidate check.
    aliases:
      - Post-integration business-map maintenance
    anchors:
      - kind: symbol
        value: CodexTaskDispatcher.taskPrompt
        description: Activates the appropriate Semantic Atlas guidance for task turns.
      - kind: symbol
        value: SemanticAtlasMaintenanceCoordinator.handleCompletedIntegration
        description: Starts repository-scoped reconciliation after task completion.

relations:
  - from: codrive.semantic-atlas-automatic-maintenance
    type: part_of
    to: codrive
    summary: Automatic business-map maintenance is a Codrive orchestration capability.

  - from: codrive.semantic-atlas-automatic-maintenance.reconcile-after-integration
    type: part_of
    to: codrive.semantic-atlas-automatic-maintenance
    summary: Post-integration reconciliation is the capability's repository-scoped maintenance scenario.

flows:
  - id: codrive.semantic-atlas-automatic-maintenance.reconcile-after-integration-flow
    name: Reconcile business map after integration
    summary: Codrive reads the same global opt-in at ordinary task-turn dispatch and again when each completed Integration is consumed; eligible completions ensure at most one reviewed, one-domain maintenance task, and each maintenance completion repeats the check only while the opt-in is enabled, stopping when it is disabled or no actionable repository candidate remains.
    scenario: codrive.semantic-atlas-automatic-maintenance.reconcile-after-integration
    startsAt: task-business-understanding-enabled
    steps:
      - id: task-business-understanding-enabled
        kind: decision
        name: Is business understanding enabled for this task turn?
        summary: The current global opt-in decides whether an ordinary task turn receives Semantic Atlas guidance.
      - id: run-task-with-business-context
        kind: action
        name: Run task with business context
        summary: Semantic Atlas decides whether the ordinary task needs business-map queries or observations while Codrive retains its normal lifecycle.
      - id: run-task-without-business-context
        kind: action
        name: Run task without automatic business context
        summary: The ordinary task continues its normal lifecycle without automatic Semantic Atlas guidance.
      - id: complete-repository-work
        kind: action
        name: Complete repository work
        summary: Reviewed work completes integration with the persistent Git repository identity resolved from its delivery.
      - id: completed-integration-eligible
        kind: decision
        name: Is this completed Integration eligible for maintenance?
        summary: Codrive re-reads the current opt-in and accepts only completions within its enabled period.
      - id: repository-maintenance-open
        kind: decision
        name: Does this repository already have open maintenance?
        summary: An existing repository-bound maintenance task covers new completed-Integration signals without a duplicate candidate query or task.
      - id: actionable-candidates-remain
        kind: decision
        name: Do actionable candidates remain?
        summary: Semantic Atlas decides whether the delivered repository currently requires maintenance.
      - id: ensure-maintenance-task
        kind: action
        name: Ensure repository maintenance
        summary: Codrive creates one repository-bound maintenance task after confirming that none is already open.
      - id: reconcile-one-business-domain
        kind: action
        name: Reconcile one business domain
        summary: Maintenance Work classifies every selected origin and prepares one domain's map change or evidence-only conclusion.
      - id: review-maintenance-result
        kind: action
        name: Independently review maintenance
        summary: Independent Review verifies one domain's proposed map change or evidence-only conclusion before Integration.
      - id: integrate-maintenance-result
        kind: action
        name: Integrate maintenance result
        summary: Integration merges an approved map candidate or verifies the approved evidence-only result.
      - id: record-maintenance-result
        kind: action
        name: Record maintenance result
        summary: Semantic Atlas retains the reviewed classification and any integrated business-map change.
      - id: complete-maintenance-task
        kind: action
        name: Complete maintenance task
        summary: Completing the maintenance Integration makes its repository eligible for another current-state check.
      - id: follow-up-maintenance-disabled
        kind: outcome
        name: Follow-up maintenance disabled
        summary: The completed task remains complete without an automatic repository check because its Integration is outside the current enabled period.
      - id: existing-maintenance-covers-repository
        kind: outcome
        name: Existing maintenance covers repository
        summary: The completed-Integration signal ends without another query or task while the repository's open maintenance continues.
      - id: maintenance-not-required
        kind: outcome
        name: No maintenance required
        summary: The repository has no actionable candidate, so Codrive creates no maintenance task.
    transitions:
      - from: task-business-understanding-enabled
        when: enabled
        to: run-task-with-business-context
      - from: task-business-understanding-enabled
        when: disabled
        to: run-task-without-business-context
      - from: run-task-with-business-context
        to: complete-repository-work
      - from: run-task-without-business-context
        to: complete-repository-work
      - from: complete-repository-work
        to: completed-integration-eligible
      - from: completed-integration-eligible
        when: eligible
        to: repository-maintenance-open
      - from: completed-integration-eligible
        when: not eligible
        to: follow-up-maintenance-disabled
      - from: repository-maintenance-open
        when: open
        to: existing-maintenance-covers-repository
      - from: repository-maintenance-open
        when: none open
        to: actionable-candidates-remain
      - from: actionable-candidates-remain
        when: candidates remain
        to: ensure-maintenance-task
      - from: actionable-candidates-remain
        when: no candidates
        to: maintenance-not-required
      - from: ensure-maintenance-task
        to: reconcile-one-business-domain
      - from: reconcile-one-business-domain
        to: review-maintenance-result
      - from: review-maintenance-result
        to: integrate-maintenance-result
      - from: integrate-maintenance-result
        to: record-maintenance-result
      - from: record-maintenance-result
        to: complete-maintenance-task
      - from: complete-maintenance-task
        to: completed-integration-eligible
